<aside class="sidebar" id="sidebar"><div class="brand"><div class="brandmark">⌁</div><div><div class="brandname">AquaLoop</div><div class="brandtag">Household water intelligence</div></div></div><div class="workspace-label">Workspace</div><nav class="nav" id="nav"><button class="active" data-page="overview"><span class="ico">◫</span>Overview</button><button data-page="assess"><span class="ico">◉</span>Assess water</button><button data-page="decision"><span class="ico">⌁</span>Source-to-use guide</button><button data-page="tracker"><span class="ico">↗</span>Water tracker</button><button data-page="audit"><span class="ico">☷</span>Home audit</button><button data-page="safety"><span class="ico">♧</span>Collection safety</button><button data-page="learn"><span class="ico">✳</span>Learn</button><button data-page="impact"><span class="ico">◎</span>Impact & method</button><button data-page="pilot"><span class="ico">⌁</span>Community pilot</button><button data-page="research"><span class="ico">◎</span>User research & alternatives</button><button data-page="economics"><span class="ico">₹</span>Cost & scale model</button><button data-page="readiness"><span class="ico">✓</span>Challenge readiness</button></nav><div class="sidebar-bottom"><div class="privacy-pill">● Saved in this browser</div><div>Your entries stay on this device. No account or cloud sync is used.</div><div style="margin-top:12px">AquaLoop AI · Demo workspace</div></div></aside>
<main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:8px"><button class="mobile-menu" id="menuBtn" aria-label="Open menu">☰</button><div class="crumb">Workspace <span style="padding:0 7px">/</span> <strong id="crumb">Overview</strong></div></div><div class="top-right"><span class="mode">● Demo mode</span><div class="avatar">AL</div></div></header><div class="content" id="pageContent"></div></main></div><div class="toast" id="toast" role="status"></div>
<script>
const KEY='aqualoop_v1';
const initial={records:[],safety:{},safetyDate:'',safetyNotes:'',audit:{},source:'ac',assessment:null,pilotRecords:[],researchRecords:[],evidenceFlags:{}};
let state;try{state={...initial,...JSON.parse(localStorage.getItem(KEY)||'{}')};}catch(e){state={...initial};}
const sources={ac:{label:'AC condensate',icon:'❄',desc:'Condensation collected from an air conditioner drain.',uses:['Outdoor plant watering where appropriate','Floor or outdoor cleaning, if suitable'],caution:'Collection surfaces, drain lines, cleaning chemicals and storage can affect quality. Do not assume condensate is clean or potable.'},ro:{label:'RO reject water',icon:'💧',desc:'Concentrated reject water from a reverse-osmosis purifier.',uses:['Floor cleaning after checking salt/mineral tolerance','Toilet flushing where the setup permits'],caution:'Reject water may have elevated dissolved salts and minerals. Avoid use on salt-sensitive plants; check the purifier and intended use.'},wash:{label:'Washing-machine discharge',icon:'🫧',desc:'Water discharged during laundry cycles.',uses:['Suitable outdoor cleaning where local rules allow','Toilet flushing with appropriate handling'],caution:'May contain detergent, soil, lint, microbes or other residues. Do not use on edible crops or where people may contact it unless professionally assessed.'}};
const pages={overview:'Overview',assess:'Assess water',decision:'Source-to-use guide',tracker:'Water tracker',audit:'Home audit',safety:'Collection safety',learn:'Learn',impact:'Impact & method',pilot:'Community pilot',research:'User research & alternatives',economics:'Cost & scale model',readiness:'Challenge readiness'};
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function total(k){return state.records.reduce((a,r)=>a+(Number(r[k])||0),0)}
function litres(n){return (Number(n)||0).toLocaleString(undefined,{maximumFractionDigits:1,minimumFractionDigits:1})+' L'}
function toast(msg){let el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2600)}
function go(page){if(!pages[page])return;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('crumb').textContent=pages[page];document.getElementById('sidebar').classList.remove('open');render(page);window.scrollTo({top:0,behavior:'smooth'});}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});document.getElementById('menuBtn').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));
function metric(label,value,foot,icon){return `<div class="metric"><div class="metric-head"><span>${label}</span><span class="metric-icon">${icon}</span></div><div class="metric-value">${value}</div><div class="metric-foot">${foot}</div></div>`}
function sectionHead(kicker,title,desc,button=''){return `<div class="section-head"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div>${button}</div>`}
function safetyProgress(){let keys=['covered','trays','standing','inspected'];return keys.filter(k=>state.safety[k]==='done').length}
function weeklyTrend(){let days=[];let now=new Date();for(let i=6;i>=0;i--){let d=new Date(now);d.setHours(0,0,0,0);d.setDate(d.getDate()-i);let key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');let val=state.records.filter(r=>r.date===key).reduce((a,r)=>a+(Number(r.reused)||0),0);days.push({key,label:d.toLocaleDateString(undefined,{weekday:'short'}),val});}let max=Math.max(1,...days.map(d=>d.val));let totalWeek=days.reduce((a,d)=>a+d.val,0);return `<section class="trend-card"><div class="trend-head"><div><div class="eyebrow">Your recent activity</div><h2>7-day reuse trend</h2><p>Based only on saved records dated within the last seven days.</p></div><div class="trend-total">${litres(totalWeek)} recorded</div></div>${state.records.length?`<div class="trend-bars" role="img" aria-label="Seven day chart of recorded reused water in litres">${days.map(d=>`<div class="trend-day" title="${esc(d.key)}: ${litres(d.val)}"><span class="trend-value">${d.val?d.val.toLocaleString(undefined,{maximumFractionDigits:1}):'—'}</span><div class="trend-bar-track"><div class="trend-bar" style="height:${d.val?Math.max(5,d.val/max*100):0}%"></div></div><span class="trend-label">${d.label}</span></div>`).join('')}</div>`:`<div class="trend-empty">Your chart will appear after you add real water-reuse records. No sample values are shown.</div>`}<div class="footer-note">A date-based activity view, not a verified savings estimate. Records marked as estimates remain estimates.</div></section>`}
function overview(){let collected=total('collected'),reused=total('reused'),eff=collected?Math.min(100,reused/collected*100):0;let breakdown=Object.keys(sources).map(k=>({k,label:sources[k].label,n:state.records.filter(r=>r.source===k).reduce((a,r)=>a+r.reused,0)}));let max=Math.max(1,...breakdown.map(x=>x.n));let recent=state.records.slice(-3).reverse();return `<div class="hero"><div><div class="eyebrow">Responsible household reuse</div><h1>Understand your water.<br>Put it to better use.</h1><p>Assess household water sources, track what you actually reuse, and manage collection responsibly. Built around source-specific guidance, honest measurement, and a pathway to community pilot evidence.</p><button class="btn btn-primary" onclick="go('assess')">Start an assessment <span>→</span></button></div><div class="hero-art"><div class="drop"></div></div></div><section class="card" style="margin-bottom:20px"><div class="card-head"><div><div class="eyebrow">Challenge problem alignment</div><h2>How can water from ACs, RO purifiers or washing machines be safely reused?</h2><p>AquaLoop's proposed response combines source-specific decision guidance, a household reuse log, collection-safety checks, and a pilot evidence workflow. It supports safer decision-making; it does not certify water quality.</p></div><span class="status done">Direct fit</span></div><div class="pill-row"><span class="evidence-pill">Source-to-use guidance</span><span class="evidence-pill">Transparent tracking</span><span class="evidence-pill">Safety-first limits</span><span class="evidence-pill">Pilot evidence log</span></div><div class="footer-note">Differentiation and outcomes remain hypotheses until tested with households, qualified reviewers, and documented pilot evidence.</div></section><div class="metrics">${metric('Recorded water reused',litres(reused),'Based on saved records','↗')}${metric('Water collected',litres(collected),'Kept separate from reuse','◉')}${metric('Reuse / collected',collected?eff.toFixed(0)+'%':'0%','Descriptive ratio, not savings','◌')}${metric('Home audit',Object.values(state.audit).filter(Boolean).length+'/5','Audit checks completed','☷')}</div>${weeklyTrend()}<div class="layout-two"><section class="card"><div class="card-head"><div><h2>Reuse by source</h2><p>Actual reused volume in your records</p></div><button class="btn btn-outline btn-small" onclick="go('tracker')">View tracker ↗</button></div>${state.records.length?`<div class="source-bars">${breakdown.map(x=>`<div><div class="source-bar-head"><span>${sources[x.k].icon} ${x.label}</span><strong>${litres(x.n)}</strong></div><div class="bar"><span style="width:${x.n/max*100}%"></span></div></div>`).join('')}</div>`:`<div class="empty"><div class="empty-icon">◌</div><strong>No reuse recorded yet</strong><p>Add your first record to see a source breakdown.</p><button class="btn btn-dark btn-small" onclick="go('tracker')">Add a record</button></div>`}<div class="footer-note">Recorded reuse is not automatically net water savings. Savings depend on the use replaced and any extra water, energy, or treatment required.</div></section><section class="card"><div class="card-head"><div><h2>Collection safety</h2><p>Separate from water-quality assessment</p></div><span class="status ${safetyProgress()===4?'done':''}">${safetyProgress()}/4</span></div>${[['covered','Containers securely covered'],['trays','AC drain trays and collection points clean'],['standing','No exposed water left standing'],['inspected','Storage tanks and outdoor containers inspected']].map(([k,l])=>`<div class="safety-item"><input class="check" type="checkbox" ${state.safety[k]==='done'?'checked':''} onchange="toggleSafety('${k}',this.checked)"><div style="flex:1"><strong>${l}</strong><small>${state.safety[k]==='done'?'Marked complete':'Needs review'}</small></div><span class="status ${state.safety[k]==='done'?'done':''}">${state.safety[k]==='done'?'Done':'Review'}</span></div>`).join('')}<button class="btn btn-outline btn-small" style="margin-top:14px" onclick="go('safety')">Review checklist →</button></section></div><div class="layout-two"><section class="card"><div class="card-head"><div><h2>Recent activity</h2><p>Your latest reuse records</p></div><button class="btn btn-outline btn-small" onclick="go('tracker')">All records</button></div>${recent.length?`<div class="table-wrap"><table class="records"><thead><tr><th>Source</th><th>Collected</th><th>Reused</th></tr></thead><tbody>${recent.map(r=>`<tr><td>${sources[r.source]?.label||r.source}<div style="font-size:10px;color:var(--muted)">${esc(r.date)}</div></td><td class="num">${litres(r.collected)}</td><td class="num">${litres(r.reused)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><strong>Your log is ready</strong><p>Collected and reused volumes are kept separate.</p><button class="btn btn-dark btn-small" onclick="go('tracker')">Add a record</button></div>`}</section><section class="card"><div class="card-head"><div><h2>Start with what you have</h2><p>A guided path from assessment to tracking</p></div></div><div class="audit-list"><div class="audit-row"><span>01</span><div><strong>Collect responsibly</strong><p>Understand source and collection conditions.</p></div></div><div class="audit-row"><span>02</span><div><strong>Assess the source</strong><p>Review risks and intended use.</p></div></div><div class="audit-row"><span>03</span><div><strong>Reuse appropriately</strong><p>Record only quantities actually reused.</p></div></div></div><button class="btn btn-dark" style="margin-top:16px" onclick="go('decision')">Open source-to-use guide →</button></section></div><section class="card" style="margin-top:18px"><div class="card-head"><div><div class="eyebrow">Core innovation</div><h2>Source → conditions → intended use → evidence</h2><p>AquaLoop does not label water safe. It helps identify questions, restrictions and next steps before a non-potable reuse decision.</p></div><span class="status">Decision support</span></div><div class="pill-row"><span class="tag">3 distinct sources</span><span class="tag">Use-specific checks</span><span class="tag">Stop / review prompts</span><span class="tag">Evidence-aware tracking</span></div><button class="btn btn-dark" onclick="go('decision')">Try the guided decision pathway →</button></section>`}
function assess(){return `${sectionHead('Source-specific guidance','Assess a water source','Use the new Source-to-use guide for a more detailed, transparent review of source, intended use and collection conditions. This page is a basic source overview.')}<section class="card"><h2>01 · Choose your source</h2><p>Select the household water source you want to understand.</p><div class="source-options">${Object.entries(sources).map(([k,s])=>`<button class="source-option ${state.source===k?'selected':''}" onclick="selectSource('${k}')"><div class="sico">${s.icon}</div><div><strong>${s.label}</strong><span>${s.desc}</span></div></button>`).join('')}</div><div class="form-grid"><div class="field"><label for="intended">Intended reuse</label><select id="intended"><option value="plants">Ornamental plants / landscaping</option><option value="cleaning">Outdoor or floor cleaning</option><option value="toilet">Toilet flushing</option><option value="laundry">Laundry-related non-contact use</option><option value="other">Other non-drinking use</option><option value="drink">Drinking, cooking, or food preparation</option></select></div><div class="field"><label for="collection">Collection conditions</label><select id="collection"><option value="covered">Clean, covered container</option><option value="open">Open or exposed container</option><option value="unknown">Unsure / not checked</option></select></div><div class="field"><label for="contact">Possible contamination</label><select id="contact"><option value="low">No obvious contamination noticed</option><option value="chem">Detergents, cleaners, salts, or chemicals may be present</option><option value="unknown">Unknown / not assessed</option></select></div><div class="field"><label for="duration">How long has it been stored?</label><select id="duration"><option value="fresh">Collected recently</option><option value="day">Stored for a day or more</option><option value="long">Stored for several days or unknown</option></select></div></div><div class="notice warning">Never use untreated household wastewater for drinking, cooking, food preparation, or ingestion. Do not rely on this questionnaire to determine water safety.</div><button class="btn btn-dark" onclick="go('decision')">Open detailed source-to-use guide →</button><div id="assessmentResult">${state.assessment?assessmentResultHTML(state.assessment):''}</div></section><div class="footer-note">Guidance is general and educational. Water quality varies by equipment, chemicals, maintenance, storage, local requirements, and intended use. When in doubt, do not reuse until professionally assessed.</div>`}
function selectSource(k){state.source=k;save();render('assess')}
function assessmentResultHTML(a){return `<div class="result-panel"><div class="eyebrow">Assessment summary · educational guidance</div><h3>${esc(a.sourceLabel)}</h3><p>${esc(a.summary)}</p><h3>Potential non-drinking uses to investigate</h3><div>${a.uses.map(u=>`<span class="tag">${esc(u)}</span>`).join('')}</div><h3 style="margin-top:14px">Risks and precautions</h3><p>${esc(a.caution)}</p>${a.block?`<div class="notice warning">${esc(a.block)}</div>`:''}<p style="margin-bottom:0"><strong>Next step:</strong> Check local regulations and the actual water quality for the intended use. This tool does not certify safety.</p><button class="btn btn-dark btn-small" style="margin-top:14px" onclick="go('tracker')">Record actual reuse →</button></div>`}
function runAssessment(){let s=sources[state.source],use=document.getElementById('intended').value,col=document.getElementById('collection').value,contact=document.getElementById('contact').value,duration=document.getElementById('duration').value;let block=use==='drink'?'Do not use untreated household wastewater for drinking, cooking, food preparation, or ingestion. Choose a different intended use.':(contact==='chem'?'Potential detergents, salts, or chemicals were indicated. Avoid sensitive uses and seek source-specific guidance.':(col!=='covered'||duration!=='fresh'?'Collection or storage conditions need attention. Inspect and improve handling before considering reuse.':''));let a={source:state.source,sourceLabel:s.label,summary:`You selected ${s.label.toLowerCase()} for ${({plants:'ornamental plants / landscaping',cleaning:'cleaning',toilet:'toilet flushing',laundry:'laundry-related non-contact use',other:'another non-drinking use',drink:'drinking / cooking / food preparation'})[use]}. ${col==='covered'?'A covered container was selected.':'Collection conditions need checking.'} Treat this as a starting point, not a pass/fail safety result.`,uses:s.uses,caution:s.caution,block};state.assessment=a;save();document.getElementById('assessmentResult').innerHTML=assessmentResultHTML(a);toast('Assessment guidance generated');}
const decisionUseLabels={plants:'Ornamental plants / landscaping',cleaning:'Outdoor or floor cleaning',toilet:'Toilet flushing',laundry:'Laundry-related non-contact use',other:'Other non-drinking use',drink:'Drinking, cooking or food preparation'};
const decisionSourceRules={
 ac:{summary:'AC condensate can contact coils, drain pans, pipework, dust or cleaning residues. Collection conditions and intended use matter.',checks:['Check the drain line and collection container condition.','Keep the source separate from other wastewater.','Do not assume clear-looking condensate is potable or microbiologically safe.'],uses:{plants:'Potential option to investigate for ornamental plants, subject to source condition and plant sensitivity.',cleaning:'Potential option to investigate for suitable outdoor cleaning, with splash/contact precautions.',toilet:'Potential option to investigate where collection and plumbing are appropriate.',laundry:'Do not assume suitable for laundry; assess the specific use and water-quality requirements.',other:'The use is too broad to assess. Specify a non-potable task before proceeding.',drink:'Do not use untreated household-source water for drinking, cooking, food preparation or ingestion.'}},
 ro:{summary:'RO reject water concentrates some dissolved substances from the feed water. Suitability depends on feed-water quality, purifier design and the intended use.',checks:['Check the purifier model and available feed-water information.','Consider dissolved salts/minerals and the tolerance of the intended use.','Do not assume reject water is suitable for every plant, surface or appliance.'],uses:{plants:'Use caution: dissolved salts may harm salt-sensitive plants. Seek source-specific advice before plant use.',cleaning:'Potential option to investigate for compatible cleaning tasks after considering residue and surface sensitivity.',toilet:'Potential option to investigate if the collection/plumbing arrangement is suitable.',laundry:'Do not assume suitable for laundry; check appliance and water-quality requirements.',other:'The use is too broad to assess. Specify a non-potable task before proceeding.',drink:'Do not use untreated household-source water for drinking, cooking, food preparation or ingestion.'}},
 wash:{summary:'Laundry discharge may contain detergents, fragrances, soil, lint, microbes or residues from items washed. Cycle and product choices change the risk.',checks:['Identify detergents, additives and items washed in the load.','Avoid reuse when chemical contamination or hygiene risks are uncertain.','Prevent contact with edible crops, children, pets and sensitive surfaces unless qualified guidance supports the use.'],uses:{plants:'Do not recommend for edible crops. For ornamental plants, suitability depends on detergent formulation, soil, plant and local guidance; seek qualified advice.',cleaning:'Potentially unsuitable depending on detergents and contamination. Review product labels, exposure and local rules first.',toilet:'Potential option to investigate only with suitable handling, plumbing and hygiene precautions.',laundry:'Do not assume laundry discharge is suitable for another laundry use. Seek specific guidance.',other:'The use is too broad to assess. Specify a non-potable task before proceeding.',drink:'Do not use untreated household-source water for drinking, cooking, food preparation or ingestion.'}}
};
function decision(){return `${sectionHead('AquaLoop core innovation','Source-to-use decision guide','A guided, transparent rules-based pathway. It does not test water, diagnose contaminants, or certify that any reuse is safe.')}<div class="layout-two"><section class="card"><div class="eyebrow">01 · Define the situation</div><h2>What water do you have?</h2><p>Answer the questions using what you know. Choose “unknown” rather than guessing.</p><div class="field"><label for="dSource">Water source</label><select id="dSource"><option value="ac">AC condensate</option><option value="ro">RO purifier reject water</option><option value="wash">Washing-machine discharge</option></select></div><div class="field"><label for="dUse">Intended use</label><select id="dUse"><option value="plants">Ornamental plants / landscaping</option><option value="cleaning">Outdoor or floor cleaning</option><option value="toilet">Toilet flushing</option><option value="laundry">Laundry-related non-contact use</option><option value="other">Other non-drinking use</option><option value="drink">Drinking, cooking or food preparation</option></select></div><div class="field"><label for="dCollection">Collection and storage</label><select id="dCollection"><option value="covered">Suitable clean, covered container; recently collected</option><option value="open">Open/exposed container or debris possible</option><option value="stored">Stored for a day or more / duration unknown</option><option value="unknown">Unknown or not checked</option></select></div><div class="field"><label for="dContam">Possible contamination</label><select id="dContam"><option value="none">No known contamination, but not tested</option><option value="possible">Chemicals, detergent, salts, residue or contamination may be present</option><option value="suspected">Suspected contamination or unusual odour/colour</option><option value="unknown">Unknown</option></select></div><div class="field"><label for="dPlumbing">Intended-use setup</label><select id="dPlumbing"><option value="manual">Manual collection; no plumbing changes</option><option value="plumbed">Connected to a plumbing/appliance system</option><option value="unknown">Unknown / not checked</option></select><span class="help">Plumbing changes may require qualified review and compliance with local rules.</span></div><button class="btn btn-dark" onclick="runDecision()">Review my scenario →</button><div id="decisionResult" aria-live="polite"></div></section><section class="card"><div class="eyebrow">02 · What makes this different</div><h2>No blanket “safe” label</h2><div class="audit-list"><div class="audit-row"><span>01</span><div><strong>Source-specific reasoning</strong><p>AC condensate, RO reject and laundry discharge trigger different cautions.</p></div></div><div class="audit-row"><span>02</span><div><strong>Uncertainty changes the outcome</strong><p>Unknown storage or suspected contamination leads to a stop/review prompt—not a green approval.</p></div></div><div class="audit-row"><span>03</span><div><strong>Advice is separated from evidence</strong><p>The guide explains what to check. Only actual records belong in the reuse tracker or pilot log.</p></div></div><div class="audit-row"><span>04</span><div><strong>Human review remains important</strong><p>Water quality, local requirements and intended exposure may require testing or qualified advice.</p></div></div></div><div class="notice warning"><strong>Safety boundary:</strong> never use untreated household wastewater for drinking, cooking, food preparation or ingestion. A questionnaire cannot verify microbial or chemical safety.</div><button class="btn btn-outline" onclick="go('learn')">Review learning library →</button></section></div><section class="card" style="margin-top:18px"><div class="card-head"><div><h2>Decision logic, made transparent</h2><p>The system uses visible rules rather than pretending to run a validated AI model.</p></div><span class="status">Prototype rules</span></div><div class="table-wrap"><table class="records"><thead><tr><th>Condition</th><th>System response</th><th>Why</th></tr></thead><tbody><tr><td>Drinking/cooking/food preparation</td><td><span class="status">Stop</span></td><td>Untreated source water is not approved for ingestion.</td></tr><tr><td>Suspected contamination</td><td><span class="status">Stop & seek review</span></td><td>Potential contamination cannot be resolved by visual inspection.</td></tr><tr><td>Unknown or poor collection/storage</td><td><span class="status">Hold & inspect</span></td><td>Handling conditions and contamination history are uncertain.</td></tr><tr><td>Non-potable use with no obvious red flags</td><td><span class="status">Investigate cautiously</span></td><td>No obvious issue is not proof of safety; suitability remains use-specific.</td></tr></tbody></table></div></section><div class="footer-note">This is a transparent rules-based prototype, not a live AI service or water-quality certification. Do not use it to bypass local requirements or expert assessment.</div>`}
function runDecision(){let source=document.getElementById('dSource').value,use=document.getElementById('dUse').value,collection=document.getElementById('dCollection').value,contam=document.getElementById('dContam').value,plumbing=document.getElementById('dPlumbing').value;let s=decisionSourceRules[source];let status='Investigate cautiously',color='';let reasons=[];if(use==='drink'){status='STOP — not an approved use';reasons.push('Do not use untreated household-source water for drinking, cooking, food preparation or ingestion.');}else if(contam==='suspected'){status='STOP — suspected contamination';reasons.push('Do not reuse this batch until the contamination concern has been resolved by an appropriate qualified assessment.');}else if(contam==='possible'||contam==='unknown'||collection!=='covered'||plumbing==='unknown'){status='HOLD — review conditions first';if(contam==='possible'||contam==='unknown')reasons.push('Contamination information is incomplete or indicates possible contaminants.');if(collection!=='covered')reasons.push('Collection/storage is open, prolonged or unknown. Inspect handling and storage; do not assume appearance proves quality.');if(plumbing==='unknown')reasons.push('The setup is not understood. Check the intended-use arrangement and applicable local requirements.');}else{status='Potential use to investigate — not a safety approval';reasons.push('No obvious red flag was selected, but this questionnaire cannot determine chemical or microbial safety.');}if(source==='ro'&&use==='plants')reasons.push('RO reject may contain elevated dissolved salts; do not use on salt-sensitive plants without appropriate assessment.');if(source==='wash'&&use==='plants')reasons.push('Laundry discharge can affect plants and soil; do not use on edible crops. Seek qualified source- and product-specific guidance before ornamental-plant use.');if(source==='wash'&&use==='cleaning')reasons.push('Detergent residues and contact exposure may make this use unsuitable; review the products, surface and local guidance.');if(source==='ac')reasons.push('Inspect the AC drain, collection surfaces and maintenance history; condensate is not automatically clean or potable.');if(source==='ro')reasons.push('Consider feed-water quality and purifier details before selecting a reuse application.');if(source==='wash')reasons.push('Consider detergent/additive ingredients and what was washed; avoid uses with uncertain exposure risks.');let out=`<div class="result-panel" style="margin-top:18px"><div class="eyebrow">Scenario review · not a safety certificate</div><h3>${esc(s.label)} → ${esc(decisionUseLabels[use])}</h3><p><strong>${esc(status)}</strong></p><p>${esc(decisionSourceRules[source].summary)}</p><h3>What to check next</h3><ul style="padding-left:20px;color:var(--muted);font-size:13px;line-height:1.7">${reasons.map(x=>`<li>${esc(x)}</li>`).join('')}${decisionSourceRules[source].checks.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="notice warning">This result is educational decision support only. It does not test the water or establish that the selected use is safe. When uncertain, do not proceed until you obtain appropriate qualified guidance.</div><button class="btn btn-outline btn-small" onclick="go('tracker')">Open reuse tracker</button></div>`;document.getElementById('decisionResult').innerHTML=out;}

function tracker(){let c=total('collected'),r=total('reused'),eff=c?Math.min(100,r/c*100):0;return `${sectionHead('Household records','Water tracker','Log what was collected and what was actually reused. Estimates are welcome when clearly labelled.',`<button class="btn btn-dark" onclick="showRecordForm()">＋ Add a record</button>`)}<div class="metrics">${metric('Total collected',litres(c),'Sum of saved collection records','◉')}${metric('Actually reused',litres(r),'Sum of saved reuse records','↗')}${metric('Reuse / collected',c?eff.toFixed(1)+'%':'0%','Ratio only; not net savings','◌')}${metric('Saved records',state.records.length,'Stored locally in this browser','▤')}</div><div id="recordFormWrap"></div><section class="card"><div class="card-head"><div><h2>Reuse records</h2><p>Each record keeps collection and reuse volumes separate.</p></div>${state.records.length?`<button class="btn btn-outline btn-small" onclick="exportCSV()">Export CSV ↓</button>`:''}</div>${state.records.length?`<div class="table-wrap"><table class="records"><thead><tr><th>Date</th><th>Source</th><th>Collected</th><th>Actually reused</th><th>Data type</th><th></th></tr></thead><tbody>${state.records.slice().reverse().map(r=>`<tr><td>${esc(r.date)}</td><td>${sources[r.source]?.label||esc(r.source)}</td><td class="num">${litres(r.collected)}</td><td class="num">${litres(r.reused)}</td><td><span class="mini-badge">${r.kind==='estimate'?'Estimate':'Measured / reported'}</span></td><td><button class="btn btn-outline btn-small" onclick="deleteRecord('${r.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><div class="empty-icon">↗</div><strong>No water reuse recorded yet</strong><p>Assess a source, then record the quantity you actually reused.</p><button class="btn btn-dark btn-small" onclick="showRecordForm()">Add first record</button></div>`}<div class="notice">Do not count the same water twice. Enter the actual quantity reused separately from the quantity collected. A reuse ratio is not the same as net water savings.</div></section>`}
function showRecordForm(){let wrap=document.getElementById('recordFormWrap');if(!wrap)return;wrap.innerHTML=`<section class="card" style="margin-bottom:18px"><div class="card-head"><div><h2>Add a water record</h2><p>Use actual quantities when possible; label estimates clearly.</p></div><button class="btn btn-outline btn-small" onclick="document.getElementById('recordFormWrap').innerHTML=''">Close ×</button></div><form onsubmit="addRecord(event)"><div class="form-grid"><div class="field"><label for="recDate">Date</label><input id="recDate" type="date" required value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label for="recSource">Water source</label><select id="recSource">${Object.entries(sources).map(([k,s])=>`<option value="${k}" ${state.source===k?'selected':''}>${s.label}</option>`).join('')}</select></div><div class="field"><label for="colLitres">Collected (litres)</label><input id="colLitres" type="number" min="0" step="0.1" required placeholder="e.g. 12.5"></div><div class="field"><label for="reuseLitres">Actually reused (litres)</label><input id="reuseLitres" type="number" min="0" step="0.1" required placeholder="e.g. 8"></div><div class="field"><label for="recKind">Data type</label><select id="recKind"><option value="measured">Measured / reported</option><option value="estimate">Estimate</option></select></div><div class="field"><label for="recUse">Reuse purpose (optional)</label><input id="recUse" maxlength="80" placeholder="e.g. outdoor cleaning"></div></div><div class="field"><label for="recNotes">Notes (optional)</label><textarea id="recNotes" maxlength="300" placeholder="How was this quantity measured or estimated?"></textarea></div><button class="btn btn-dark" type="submit">Save record</button></form></section>`;wrap.scrollIntoView({behavior:'smooth',block:'start'});}
function addRecord(e){e.preventDefault();let c=Number(document.getElementById('colLitres').value),r=Number(document.getElementById('reuseLitres').value);if(r>c){toast('Reused volume cannot exceed collected volume in one record.');return}let id='r'+Date.now();state.records.push({id,date:document.getElementById('recDate').value,source:document.getElementById('recSource').value,collected:c,reused:r,kind:document.getElementById('recKind').value,use:document.getElementById('recUse').value,notes:document.getElementById('recNotes').value});save();render('tracker');toast('Record saved in this browser');}
function deleteRecord(id){if(!confirm('Delete this record?'))return;state.records=state.records.filter(r=>r.id!==id);save();render('tracker');toast('Record deleted')}
function exportCSV(){let rows=[['Date','Source','Collected (L)','Actually reused (L)','Data type','Purpose','Notes'],...state.records.map(r=>[r.date,sources[r.source]?.label||r.source,r.collected,r.reused,r.kind,r.use||'',r.notes||''])];let csv=rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.download='aqualoop-water-records.csv';a.click();URL.revokeObjectURL(a.href);}
const auditItems=[['sources','I identified household water sources','List AC condensate, RO reject water, laundry discharge, and other sources.'],['separate','I keep different sources separate','Avoid mixing sources with different characteristics or contaminants.'],['intended','I have a clear non-drinking reuse purpose','Match handling to the actual intended use and local rules.'],['measure','I can estimate or measure volumes consistently','Record collection and actual reuse separately.'],['review','I know when to stop and seek advice','Stop if contamination, unusual odour, or uncertainty is present.']];
function audit(){let n=Object.values(state.audit).filter(Boolean).length;return `${sectionHead('Household water audit','Map your opportunities','A short guided audit helps identify routines to review. It is not a plumbing inspection or water-quality certification.')}<section class="card"><div class="card-head"><div><h2>Your household audit</h2><p>Check each item that applies to your current routine.</p></div><span class="status ${n===5?'done':''}">${n}/5 complete</span></div><div class="progress"><span style="width:${n/5*100}%"></span></div><div class="audit-list">${auditItems.map(([k,t,d])=>`<label class="audit-row"><input type="checkbox" ${state.audit[k]?'checked':''} onchange="toggleAudit('${k}',this.checked)"><span><strong>${t}</strong><p>${d}</p></span></label>`).join('')}</div><div class="result-panel"><h3>${n===5?'Audit checklist completed':n===0?'Start with one practical step':'Your next step'}</h3><p>${n===5?'You have reviewed all five routine prompts. Revisit them when household equipment or practices change.':n===0?'Begin by identifying the water sources available at your home, then assess each source separately.':'Continue reviewing the remaining items and use source-specific guidance before reuse.'}</p><button class="btn btn-dark btn-small" onclick="go('assess')">Assess a source →</button></div></section>`}
function toggleAudit(k,v){state.audit[k]=v;save();render('audit')}
const safetyItems=[['covered','Collection containers are securely covered','Use a suitable cover and avoid leaving exposed water accessible to insects or debris.'],['trays','AC drain trays and collection points are clean','Check for blocked drains, residue, and stagnant water.'],['standing','No exposed water has been left standing','Inspect buckets, plant saucers, gutters, and other places where water can collect.'],['inspected','Storage tanks and outdoor containers were inspected','Check covers, leaks, and condition of containers regularly.']];
function safety(){let n=safetyProgress();return `${sectionHead('Supporting collection safety','Water collection & mosquito safety','Water quality and mosquito-breeding risk are separate considerations. This checklist supports routine inspection; it does not certify water quality or guarantee disease prevention.')}<div class="layout-two"><section class="card"><div class="card-head"><div><h2>Inspection checklist</h2><p>Mark the current status of each item.</p></div><span class="status ${n===4?'done':''}">${n}/4 complete</span></div><div class="progress"><span style="width:${n/4*100}%"></span></div>${safetyItems.map(([k,t,d])=>`<div class="safety-item"><div style="flex:1"><strong>${t}</strong><small>${d}</small><div class="pill-row" style="margin-top:9px"><button class="btn btn-small ${state.safety[k]==='done'?'btn-dark':'btn-outline'}" onclick="setSafety('${k}','done')">Completed</button><button class="btn btn-small ${state.safety[k]==='attention'?'btn-dark':'btn-outline'}" onclick="setSafety('${k}','attention')">Needs attention</button><button class="btn btn-small ${state.safety[k]==='na'?'btn-dark':'btn-outline'}" onclick="setSafety('${k}','na')">Not applicable</button></div></div></div>`).join('')}<div class="field" style="margin-top:18px"><label for="inspectDate">Last inspection date</label><input type="date" id="inspectDate" value="${esc(state.safetyDate)}" onchange="state.safetyDate=this.value;save();toast('Inspection date saved')"></div><div class="field"><label for="inspectNotes">Inspection notes</label><textarea id="inspectNotes" maxlength="500" placeholder="Add any follow-up actions..." onchange="state.safetyNotes=this.value;save()">${esc(state.safetyNotes)}</textarea></div><button class="btn btn-dark" onclick="saveSafety()">Save inspection</button></section><section class="card"><div class="eyebrow">Routine reminder</div><h2>Check weekly, or after heavy rain</h2><p>Recheck covers, trays, buckets, plant saucers, gutters, and outdoor containers. This website stores an in-app inspection date; it does not send background notifications.</p><div class="notice">Mosquito safety is not proof of water quality. Likewise, water that appears clear is not necessarily suitable for reuse.</div><h3>Stop and review if you notice</h3><ul style="font-size:12px;color:var(--muted);padding-left:19px"><li>Unusual odour, colour, residue, or suspected chemical contamination.</li><li>Leaking, damaged, or uncovered storage.</li><li>Any intended use involving drinking, cooking, or food preparation.</li></ul></section></div>`}
function setSafety(k,v){state.safety[k]=v;save();render('safety')}
function toggleSafety(k,v){state.safety[k]=v?'done':'';save();render('overview')}
function saveSafety(){state.safetyDate=document.getElementById('inspectDate').value;state.safetyNotes=document.getElementById('inspectNotes').value;save();toast('Inspection details saved')}
const lessons=[['💧','Know your source','Different household sources can contain different residues. Equipment, maintenance, and collection conditions matter.'],['🧪','Quality is use-specific','A source that may suit one non-drinking task may be unsuitable for another. Testing and local rules may be needed.'],['📏','Measure honestly','Keep collected and actually reused quantities separate. Label estimates and avoid double counting.'],['🌿','Protect plants and surfaces','Salts, detergents, and cleaning products can damage sensitive plants or materials. Check the source first.'],['🪣','Store responsibly','Use suitable covered containers, keep them clean, and avoid prolonged storage when conditions are uncertain.'],['🦟','Inspect standing water','Check collection points and containers routinely. Mosquito-risk checks do not establish water quality.']];
function learn(){return `${sectionHead('Knowledge library','Learn to reuse responsibly','Short practical guides to help households make better-informed choices.')}<div class="learn-grid">${lessons.map(([i,t,d],idx)=>`<article class="learn-card"><div class="sico">${i}</div><h3>${t}</h3><p>${d}</p><div class="read">GUIDE ${String(idx+1).padStart(2,'0')}</div></article>`).join('')}</div><div class="notice warning" style="margin-top:20px">Never drink, cook with, or prepare food using untreated household wastewater. This library is educational and does not replace professional testing, local regulations, or source-specific advice.</div>`}
function impact(){let c=total('collected'),r=total('reused'),un=Math.max(0,c-r);return `${sectionHead('Transparent measurement','Impact & method','Understand what the tracker can and cannot claim. AquaLoop reports entered data; it does not independently verify measurements.')}<div class="impact-grid"><section class="impact-callout"><div class="eyebrow" style="color:#a9dbc2">Your recorded reuse</div><div class="big">${litres(r)}</div><p>Sum of quantities marked as actually reused in saved records. Entries may be measured, reported, or estimated as labelled.</p></section><section class="card"><h2>What we calculate</h2><div class="small-stat"><span>Total collected</span><strong>${litres(c)}</strong></div><div class="small-stat" style="margin-top:10px"><span>Collected but not recorded as reused</span><strong>${litres(un)}</strong></div><div class="small-stat" style="margin-top:10px"><span>Reuse-to-collected ratio</span><strong>${c?(r/c*100).toFixed(1):'0.0'}%</strong></div></section></div><section class="card" style="margin-top:16px"><h2>What these numbers mean</h2><div class="audit-list"><div class="audit-row"><span>✓</span><div><strong>Recorded reuse</strong><p>The sum of quantities you entered as actually reused.</p></div></div><div class="audit-row"><span>≠</span><div><strong>Net water savings</strong><p>Net savings depend on which water use was replaced, additional water or energy required, treatment, leakage, and other factors. This version does not calculate verified net savings.</p></div></div><div class="audit-row"><span>i</span><div><strong>Environmental or health impact</strong><p>No claims are made about measured environmental outcomes, disease reduction, or water safety. Those require appropriate evidence and validation.</p></div></div></div><div class="notice">For a competition pilot, validate the approach with documented household observations, suitable water-quality testing where relevant, and a transparent methodology. Do not present demo or estimated figures as field results.</div><button class="btn btn-outline" onclick="exportCSV()" ${state.records.length?'':'disabled'}>Export my records as CSV ↓</button></section><div class="footer-note">Privacy: data is stored in this browser using local storage. Clearing browser data may remove it. There is no account, cloud sync, or background notification in this demo.</div>`}

function pilot(){let rows=Array.isArray(state.pilotRecords)?state.pilotRecords:[];let measured=rows.filter(r=>r.method==='measured').length;let baseline=rows.reduce((a,r)=>a+(Number(r.baseline)||0),0);let follow=rows.reduce((a,r)=>a+(Number(r.followup)||0),0);let delta=baseline?((baseline-follow)/baseline*100):null;return `${sectionHead('Evidence before claims','Community pilot lab','A structured way to document whether AquaLoop changes household water practices. Use anonymous household codes, obtain consent, and report limitations honestly.',`<button class="btn btn-outline" onclick="exportPilot()" ${rows.length?'':'disabled'}>Export pilot CSV ↓</button>`)}
<div class="notice warning"><strong>Evidence integrity:</strong> this page does not create pilot results. Only enter real observations you have permission to collect. Use anonymous IDs, never names, phone numbers, exact addresses, or sensitive household details. This browser-only prototype is not a secure research database.</div>
<div class="metrics">${metric('Household observations',rows.length,'Records entered by you','⌂')}${metric('Measured entries',measured,'Marked measured only by your selection','✓')}${metric('Baseline litres/day',litres(baseline),'Sum across records; not population impact','◉')}${metric('Follow-up litres/day',litres(follow),'Sum across records; compare like-for-like','↗')}</div>
<section class="card"><div class="card-head"><div><h2>Add a household observation</h2><p>Use the same measurement method and comparable time window before and after introducing a reuse practice.</p></div></div>
<div class="form-grid"><div class="field"><label for="pilotCode">Anonymous household code *</label><input id="pilotCode" maxlength="24" placeholder="e.g. H-001" required><span class="help">Do not use a person's name or address.</span></div><div class="field"><label for="pilotDate">Observation date *</label><input id="pilotDate" type="date" value="${new Date().toISOString().slice(0,10)}" required></div><div class="field"><label for="pilotSource">Source assessed</label><select id="pilotSource"><option value="ac">AC condensate</option><option value="ro">RO reject water</option><option value="wash">Washing-machine discharge</option><option value="mixed">Other / not classified</option></select></div><div class="field"><label for="pilotMethod">Measurement method *</label><select id="pilotMethod"><option value="measured">Measured with a marked container / meter</option><option value="reported">Household-reported</option><option value="estimate">Estimated</option></select></div><div class="field"><label for="pilotBaseline">Baseline water discarded (L/day) *</label><input id="pilotBaseline" type="number" min="0" max="100000" step="0.1" placeholder="Before reuse practice"></div><div class="field"><label for="pilotFollowup">Follow-up water actually reused (L/day) *</label><input id="pilotFollowup" type="number" min="0" max="100000" step="0.1" placeholder="After reuse practice"></div><div class="field"><label for="pilotCost">Additional setup cost (₹, optional)</label><input id="pilotCost" type="number" min="0" max="10000000" step="1" placeholder="Only if known"></div><div class="field"><label for="pilotDays">Follow-up period (days)</label><input id="pilotDays" type="number" min="1" max="3650" step="1" value="7"></div></div>
<div class="field"><label for="pilotNotes">Observation notes / barriers</label><textarea id="pilotNotes" maxlength="600" placeholder="e.g. collection interrupted; estimated quantity; reuse purpose; user feedback (no personal data)"></textarea></div>
<label class="audit-row" style="margin-bottom:16px"><input type="checkbox" id="pilotConsent"><span><strong>Consent confirmed</strong><p>I have permission to record this anonymous observation and explained its purpose.</p></span></label>
<button class="btn btn-dark" onclick="addPilotRecord()">Save observation →</button><div id="pilotMsg" class="help" role="status" style="margin-top:10px"></div></section>
<section class="card" style="margin-top:18px"><div class="card-head"><div><h2>Evidence log</h2><p>Baseline and follow-up values are not directly comparable unless the measurement windows and methods are appropriate.</p></div><span class="status">${rows.length} records</span></div>${rows.length?`<div class="table-wrap"><table class="records"><thead><tr><th>Code / date</th><th>Source</th><th>Baseline L/day</th><th>Follow-up L/day</th><th>Method</th><th></th></tr></thead><tbody>${rows.slice().reverse().map(r=>`<tr><td>${esc(r.code)}<div class="help">${esc(r.date)}</div></td><td>${esc((sources[r.source]||{}).label||'Other')}</td><td class="num">${Number(r.baseline).toLocaleString()}</td><td class="num">${Number(r.followup).toLocaleString()}</td><td><span class="mini-badge">${esc(r.method)}</span></td><td><button class="btn btn-outline btn-small" onclick="deletePilotRecord('${r.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><div class="empty-icon">⌁</div><strong>No pilot observations yet</strong><p>Start with consented, anonymous, real observations. No sample results are prefilled.</p></div>`}</section>
<section class="card" style="margin-top:18px"><h2>How to report results responsibly</h2><div class="audit-list"><div class="audit-row"><span>01</span><div><strong>Define the baseline</strong><p>Record discarded water and current practices before the intervention, using a consistent time window.</p></div></div><div class="audit-row"><span>02</span><div><strong>Track follow-up consistently</strong><p>Measure actual reuse, not merely water collected. Record interruptions, estimates, and missing data.</p></div></div><div class="audit-row"><span>03</span><div><strong>Report limitations</strong><p>Small convenience samples do not represent all households. Do not infer health outcomes or claim causation from this log alone.</p></div></div></div><div class="notice">The figures above are simple sums of entered records, not a validated impact evaluation. Do not present them as verified savings without a documented protocol and checks.</div></section>`}
function addPilotRecord(){let code=document.getElementById('pilotCode').value.trim(),date=document.getElementById('pilotDate').value,baseline=Number(document.getElementById('pilotBaseline').value),followup=Number(document.getElementById('pilotFollowup').value),method=document.getElementById('pilotMethod').value,consent=document.getElementById('pilotConsent').checked;let msg=document.getElementById('pilotMsg');if(!code||!date||document.getElementById('pilotBaseline').value===''||document.getElementById('pilotFollowup').value===''||!consent){msg.textContent='Enter the required values and confirm consent before saving.';return}if(baseline<0||followup<0||!Number.isFinite(baseline)||!Number.isFinite(followup)){msg.textContent='Volumes must be valid non-negative numbers.';return}if(followup>baseline*3&&baseline>0){if(!confirm('Follow-up reuse is over three times the baseline discarded volume. Please verify the units and values. Save anyway?'))return}let rows=Array.isArray(state.pilotRecords)?state.pilotRecords:[];rows.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),code:code,date,source:document.getElementById('pilotSource').value,method,baseline,followup,cost:document.getElementById('pilotCost').value===''?'':Number(document.getElementById('pilotCost').value),days:Math.max(1,Number(document.getElementById('pilotDays').value)||7),notes:document.getElementById('pilotNotes').value.trim(),consent:true});state.pilotRecords=rows;save();render('pilot');toast('Anonymous observation saved')}
function deletePilotRecord(id){if(!confirm('Delete this pilot observation?'))return;state.pilotRecords=(state.pilotRecords||[]).filter(r=>r.id!==id);save();render('pilot')}
function exportPilot(){let rows=[['Anonymous code','Date','Source','Method','Baseline discarded L/day','Follow-up reused L/day','Additional setup cost INR','Follow-up days','Consent confirmed','Notes'],...(state.pilotRecords||[]).map(r=>[r.code,r.date,(sources[r.source]||{}).label||'Other',r.method,r.baseline,r.followup,r.cost,r.days,r.consent?'Yes':'No',r.notes||''])];let csv=rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.download='aqualoop-anonymous-pilot-observations.csv';a.click();URL.revokeObjectURL(a.href)}


function readiness(){let interviews=(state.researchRecords||[]).filter(x=>x.type==='interview').length,measured=(state.pilotRecords||[]).filter(x=>x.method==='measured').length,observations=(state.pilotRecords||[]).length,flags=state.evidenceFlags||{};let items=[['Problem evidence','Documented conversations with intended users','research'],['Pilot evidence','Real observations recorded with method and consent','pilot'],['Measurement quality','At least one entry marked measured (still requires checking)','measured'],['Alternative research','Compared current workarounds and existing solutions','alternatives'],['Cost model','Entered locally researched cost assumptions','costs'],['Safety review','Source-specific risks and intended uses reviewed with a qualified source','safety']];let completed=items.filter(x=>x[2]==='research'?interviews>0:x[2]==='pilot'?observations>0:x[2]==='measured'?measured>0:!!flags[x[2]]).length;return `${sectionHead('Evaluator lens','Challenge readiness','A transparent self-check against common social-innovation judging concerns. This is not an official Tata score, a prediction of selection, or independent verification.',`<button class="btn btn-outline" onclick="go('research')">Add evidence →</button>`)}<div class="layout-two"><section class="impact-callout"><div class="eyebrow" style="color:#a9dbc2">Self-reported readiness</div><div class="score-number" style="color:#fff">${completed}/6</div><p>Evidence areas with at least one recorded artifact or marked review. Completeness is not quality, validity, or proof of impact.</p><div class="progress"><span style="width:${completed/6*100}%;background:#a9dbc2"></span></div></section><section class="card"><h2>What can raise confidence?</h2><div class="audit-list"><div class="audit-row"><span>01</span><div><strong>Evidence over promises</strong><p>Bring anonymised interview notes, photos only with permission, and measurement records.</p></div></div><div class="audit-row"><span>02</span><div><strong>Show alternatives honestly</strong><p>Explain what households already do and why a new workflow improves it.</p></div></div><div class="audit-row"><span>03</span><div><strong>Prove practical feasibility</strong><p>Include setup cost, maintenance, source risks, and a bounded pilot plan.</p></div></div></div></section></div><section class="card"><h2>Evidence checklist</h2><p>Mark a review complete only when you have actually done it. Progress is stored locally and is not independently verified.</p><div class="readiness-grid">${items.map(([title,desc,key])=>{let done=key==='research'?interviews>0:key==='pilot'?observations>0:key==='measured'?measured>0:!!flags[key];return `<div class="readiness-item"><strong>${title} <span class="status ${done?'done':''}">${done?'Evidence entered':'Needs work'}</span></strong><p>${desc}</p>${['alternatives','costs','safety'].includes(key)?`<label><input type="checkbox" ${flags[key]?'checked':''} onchange="setEvidenceFlag('${key}',this.checked)"> I have completed this review</label>`:`<small class="help">${key==='research'?interviews+' interview entr'+(interviews===1?'y':'ies'):key==='pilot'?observations+' observation record(s)':measured+' measured entry/entries'}</small>`}</div>`}).join('')}</div><div class="notice warning"><strong>Do not game the checklist.</strong> A checked box is a personal declaration, not proof. The most important missing evidence may still be independent water-quality assessment, user willingness, reliable unit economics, and a real-world pilot.</div><button class="btn btn-dark" onclick="go('pilot')">Open pilot lab →</button> <button class="btn btn-outline" onclick="go('economics')">Build cost model →</button></section>`}
function setEvidenceFlag(key,val){state.evidenceFlags=state.evidenceFlags||{};state.evidenceFlags[key]=!!val;save();render('readiness')}
function research(){let rows=Array.isArray(state.researchRecords)?state.researchRecords:[];return `${sectionHead('Discover before you scale','User research & alternatives','Capture what real households say, what they currently do, and what would make reuse practical. Use consent and anonymous codes; never enter personal identifiers.',`<button class="btn btn-outline" onclick="exportResearch()" ${rows.length?'':'disabled'}>Export research CSV ↓</button>`)}<div class="notice warning"><strong>Evidence honesty:</strong> no interviews or competitor research are prefilled. Add only real conversations and observations. Do not treat a planned interview as completed or a hypothesis as a finding.</div><section class="card"><h2>Log a user conversation or observation</h2><p>Record a useful summary, not names, phone numbers, addresses, or sensitive personal details.</p><div class="form-grid"><div class="field"><label for="researchCode">Anonymous participant code *</label><input id="researchCode" maxlength="24" placeholder="e.g. P-001"></div><div class="field"><label for="researchDate">Date *</label><input id="researchDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label for="researchType">Evidence type</label><select id="researchType"><option value="interview">User interview</option><option value="observation">Household observation</option><option value="expert">Expert / practitioner conversation</option><option value="desk">Desk research (cite source in notes)</option></select></div><div class="field"><label for="researchTopic">Main topic</label><select id="researchTopic"><option>Current water disposal practice</option><option>Intended reuse and concerns</option><option>Safety and storage</option><option>Willingness to adopt</option><option>Cost and maintenance</option><option>Existing alternatives</option></select></div></div><div class="field"><label for="researchFinding">What was actually said or observed? *</label><textarea id="researchFinding" maxlength="1200" placeholder="Summarise the evidence faithfully. Separate direct observation from interpretation."></textarea></div><div class="field"><label for="researchBarrier">Barrier / quote (optional, anonymised)</label><textarea id="researchBarrier" maxlength="500" placeholder="Do not include identifying information."></textarea></div><label class="audit-row" style="margin-bottom:16px"><input type="checkbox" id="researchConsent"><span><strong>Consent / appropriate source basis confirmed</strong><p>For interviews, permission to record anonymous notes was obtained.</p></span></label><button class="btn btn-dark" onclick="addResearchRecord()">Save evidence note →</button><div id="researchMsg" class="help" role="status" style="margin-top:10px"></div></section><section class="card" style="margin-top:18px"><div class="card-head"><div><h2>Research evidence log</h2><p>Entries are self-reported and stored in this browser.</p></div><span class="status">${rows.length} entries</span></div>${rows.length?`<div class="table-wrap"><table class="records"><thead><tr><th>Code / date</th><th>Type</th><th>Topic</th><th>Evidence summary</th><th></th></tr></thead><tbody>${rows.slice().reverse().map(r=>`<tr><td>${esc(r.code)}<div class="help">${esc(r.date)}</div></td><td>${esc(r.type)}</td><td>${esc(r.topic)}</td><td>${esc(r.finding)}${r.barrier?`<div class="help">Barrier: ${esc(r.barrier)}</div>`:''}</td><td><button class="btn btn-outline btn-small" onclick="deleteResearchRecord('${r.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><strong>No research notes yet</strong><p>Start with 5–8 diverse household conversations as a practical discovery target, not as a representative sample.</p></div>`}</section><section class="card" style="margin-top:18px"><h2>Alternatives and differentiation hypothesis</h2><p>These are categories to investigate, not a verified competitor ranking. Confirm locally through interviews, product research, and source citations before claiming an advantage.</p><div class="table-wrap"><table class="records"><thead><tr><th>Alternative category</th><th>Potential strength</th><th>Questions to test</th></tr></thead><tbody><tr><td>Do nothing / discard water</td><td>No setup effort</td><td>What prevents reuse today: time, space, uncertainty, or low volume?</td></tr><tr><td>Manual bucket / direct reuse</td><td>Low cost, simple</td><td>Does tracking and source-specific guidance solve a real pain point?</td></tr><tr><td>Plumbing or storage retrofit</td><td>May support larger volumes</td><td>What are installation cost, maintenance, permissions, and cross-connection risks?</td></tr><tr><td>Generic water-saving tracker</td><td>Can build awareness</td><td>Does it distinguish AC condensate, RO reject, and laundry discharge?</td></tr><tr><td>AquaLoop concept</td><td>Proposed combination of source-to-use guidance, logging, and pilot evidence</td><td>Will households use it? Does it change safe behaviour versus existing methods?</td></tr></tbody></table></div><div class="notice">Differentiation claim to test: “A source-specific decision and evidence workflow for common household non-potable water streams.” Do not claim it is unique until alternatives have been researched.</div></section>`}
function addResearchRecord(){let code=document.getElementById('researchCode').value.trim(),date=document.getElementById('researchDate').value,finding=document.getElementById('researchFinding').value.trim(),consent=document.getElementById('researchConsent').checked,msg=document.getElementById('researchMsg');if(!code||!date||!finding||!consent){msg.textContent='Complete the required fields and confirm consent/source basis.';return}let rows=Array.isArray(state.researchRecords)?state.researchRecords:[];rows.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),code,date,type:document.getElementById('researchType').value,topic:document.getElementById('researchTopic').value,finding,barrier:document.getElementById('researchBarrier').value.trim()});state.researchRecords=rows;save();render('research');toast('Evidence note saved')}
function deleteResearchRecord(id){if(!confirm('Delete this research note?'))return;state.researchRecords=(state.researchRecords||[]).filter(r=>r.id!==id);save();render('research')}
function exportResearch(){let rows=[['Anonymous code','Date','Evidence type','Topic','Finding','Barrier'],...(state.researchRecords||[]).map(r=>[r.code,r.date,r.type,r.topic,r.finding,r.barrier||''])];let csv=rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.download='aqualoop-user-research.csv';a.click();URL.revokeObjectURL(a.href)}
function economics(){return `${sectionHead('Feasibility, not fantasy','Cost & scale model','Use local quotes and clearly labelled assumptions to estimate setup economics. This calculator does not assume a fixed water tariff or claim that all collected water becomes useful savings.') }<div class="notice warning">All values below are your assumptions until replaced with real quotes and measured use. Exclude unsafe uses. A positive financial result does not prove water quality, adoption, or social impact.</div><section class="card"><h2>Household unit-economics calculator</h2><p>Enter plausible values for one household. Change the defaults to match actual local observations or vendor quotes.</p><div class="form-grid"><div class="field"><label for="ecoSetup">One-time setup cost (₹)</label><input id="ecoSetup" type="number" min="0" value="800" oninput="calcEconomics()"></div><div class="field"><label for="ecoMonthly">Monthly maintenance / consumables (₹)</label><input id="ecoMonthly" type="number" min="0" value="50" oninput="calcEconomics()"></div><div class="field"><label for="ecoLitres">Water actually replacing purchased / supplied water (L/day)</label><input id="ecoLitres" type="number" min="0" step="0.1" value="10" oninput="calcEconomics()"></div><div class="field"><label for="ecoTariff">Avoidable marginal water cost (₹/1,000 L)</label><input id="ecoTariff" type="number" min="0" step="0.1" value="30" oninput="calcEconomics()"><span class="help">Use the real marginal cost for the household, not a generic advertised tariff.</span></div><div class="field"><label for="ecoYears">Evaluation period (years)</label><input id="ecoYears" type="number" min="1" max="20" value="3" oninput="calcEconomics()"></div><div class="field"><label for="ecoAdoption">Households in a proposed pilot</label><input id="ecoAdoption" type="number" min="1" max="100000" value="10" oninput="calcEconomics()"></div></div><div id="ecoOutput" class="calc-output"></div><div class="notice">Simple scenario model: assumes the entered daily replacement volume is achieved every day. It excludes installation variation, financing, opportunity cost, treatment/testing, failure, seasonality, and the fact that some water may not displace a paid supply. Treat outputs as directional only.</div></section><section class="card" style="margin-top:18px"><h2>Scale-up questions to answer before a pitch</h2><div class="audit-list"><div class="audit-row"><span>₹</span><div><strong>Who pays, and for what?</strong><p>Household app, community/NGO deployment, housing-society service, or retrofit partner are hypotheses—not validated revenue streams.</p></div></div><div class="audit-row"><span>⚙</span><div><strong>What is the real delivery cost?</strong><p>Include equipment, installation, maintenance, user support, water-quality checks, and replacement parts where relevant.</p></div></div><div class="audit-row"><span>⌂</span><div><strong>What makes adoption stick?</strong><p>Measure continued use after 2–4 weeks, not just initial interest. Record reasons for drop-off.</p></div></div><div class="audit-row"><span>✓</span><div><strong>What must be locally approved?</strong><p>Confirm applicable plumbing, building, public-health, wastewater, and water-quality requirements with competent local authorities or professionals.</p></div></div></div></section>`}
function calcEconomics(){let v=id=>Math.max(0,Number(document.getElementById(id)?.value)||0),setup=v('ecoSetup'),maint=v('ecoMonthly'),daily=v('ecoLitres'),tariff=v('ecoTariff'),years=Math.max(1,v('ecoYears')),homes=Math.max(1,v('ecoAdoption'));let annualLitres=daily*365,annualValue=annualLitres/1000*tariff-maint*12,totalValue=annualValue*years-setup,netPilot=totalValue*homes;let fmt=n=>'₹'+Math.round(n).toLocaleString('en-IN');let out=document.getElementById('ecoOutput');if(out)out.innerHTML=`<div class="calc-tile"><span>Modelled annual displaced volume</span><strong>${Math.round(annualLitres).toLocaleString('en-IN')} L</strong></div><div class="calc-tile"><span>Estimated annual net financial benefit</span><strong>${fmt(annualValue)}</strong></div><div class="calc-tile"><span>${years}-year benefit after setup</span><strong>${fmt(totalValue)}</strong></div><div class="calc-tile"><span>Setup cost for ${homes} households</span><strong>${fmt(setup*homes)}</strong></div><div class="calc-tile"><span>Annual maintenance for pilot</span><strong>${fmt(maint*12*homes)}</strong></div><div class="calc-tile"><span>Modelled ${years}-year net total</span><strong>${fmt(netPilot)}</strong></div>`}

function render(page){let fn={overview,assess,decision,tracker,audit,safety,learn,impact,pilot,research,economics,readiness}[page]||overview;document.getElementById('pageContent').innerHTML=fn();if(page==='economics')calcEconomics();}
render('overview');
</script></body></html>
